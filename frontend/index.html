<!DOCTYPE html>
<html lang="en" data-theme="dark" data-lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#1a1a1c" />
  <title>Kimi Chat</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/atom-one-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button class="new-chat-btn" id="newChatBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        <span data-i18n="newChat">New chat</span>
      </button>
      <button class="icon-btn sidebar-close-mobile" id="sidebarCloseMobile" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="chats-list" id="chatsList"></div>

    <div class="sidebar-footer">
      <div class="user-block" id="userBlock">
        <div class="user-avatar" id="userAvatar">?</div>
        <div class="user-info">
          <div class="user-name" id="userName">—</div>
          <div class="user-role" id="userRole" style="display:none">👑 Owner</div>
        </div>
        <button class="icon-btn user-menu-btn" id="userMenuBtn" aria-label="Menu">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="6" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="18" r="1.6"/></svg>
        </button>
        <div class="user-menu" id="userMenu">
          <button class="user-menu-item" id="ownerPanelBtn" style="display:none">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span data-i18n="manageUsers">Manage users</span>
          </button>
          <button class="user-menu-item" id="langMenuBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 010 20M12 2a15.3 15.3 0 000 20"/></svg>
            <span data-i18n="switchLang">Switch language</span>
          </button>
          <button class="user-menu-item" id="themeMenuBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
            <span data-i18n="toggleTheme">Toggle theme</span>
          </button>
          <button class="user-menu-item" id="logoutBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span data-i18n="logout">Logout</span>
          </button>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="sidebarToggle" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>

      <div class="topbar-controls">
        <select class="model-select" id="modelSelect" title="Model"></select>
        <select class="mode-select" id="modeSelect" title="Mode">
          <option value="lite">⚡ Lite</option>
          <option value="fast" selected>🚀 Fast</option>
          <option value="thinking">🧠 Thinking</option>
        </select>
      </div>

      <button class="icon-btn" id="topNewChat" aria-label="New chat">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>

    <div class="messages" id="messages">
      <!-- welcome injected dynamically by app.js -->
    </div>

    <div class="composer-wrapper">
      <div class="composer" id="composer">
        <div class="attachments" id="attachments"></div>
        <div class="composer-inner">
          <div class="composer-actions">
            <button class="composer-btn" id="attachBtn" aria-label="Attach image" title="Attach image">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
            </button>
            <button class="composer-btn" id="attachFileBtn" aria-label="Attach file" title="Attach file">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
            </button>
          </div>
          <input type="file" id="imageInput" accept="image/*" hidden />
          <input type="file" id="fileInput" accept=".txt,.md,.py,.js,.ts,.html,.css,.json,.csv,.pdf,.xml,.yml,.yaml" hidden />
          <textarea id="input" rows="1" data-i18n-placeholder="inputPlaceholder" placeholder="Message Kimi..."></textarea>
          <button class="send-btn" id="sendBtn" aria-label="Send">
            <svg id="sendIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            <svg id="stopIcon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
        </div>
        <div class="composer-hint" data-i18n="hint">Kimi may make mistakes. Verify important info.</div>
      </div>
    </div>
  </main>

  <!-- Owner: users panel -->
  <div class="modal" id="ownerModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 data-i18n="usersTitle">Users</h3>
        <button class="icon-btn" id="closeOwnerModal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div id="usersList" class="users-list"></div>
      </div>
    </div>
  </div>

  <!-- HTML preview modal -->
  <div class="modal" id="htmlPreviewModal">
    <div class="modal-card html-preview-card">
      <div class="modal-header">
        <h3 data-i18n="htmlPreview">HTML Preview</h3>
        <div style="display:flex; gap: 8px;">
          <button class="btn-secondary" id="openInWindowBtn" data-i18n="openInWindow">Open in window</button>
          <button class="icon-btn" id="closeHtmlPreview">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
      <div class="modal-body" style="padding: 0;">
        <iframe id="htmlPreviewFrame" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
      </div>
    </div>
  </div>

  <!-- Image preview modal -->
  <div class="modal" id="imageModal">
    <div class="modal-card" style="max-width: 90vw; max-height: 90vh; background: transparent; border: none; box-shadow: none;">
      <button class="icon-btn" id="closeImageModal" style="position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); color: white;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <img id="imageModalImg" style="max-width: 100%; max-height: 90vh; border-radius: 12px;" />
    </div>
  </div>

  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
